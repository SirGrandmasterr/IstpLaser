# Included by every location in default.conf. nginx does not inherit add_header
# from an outer block into a location that sets its own add_header, so each
# location that adds a header must include these too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
